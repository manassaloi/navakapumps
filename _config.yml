# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Navaka Pumps
# email: your-email@example.com
# Fallback meta description; pages set their own `description` (keep under ~155 characters).
description: Navaka Pumps, Coimbatore, is a trading house and exporter of industrial pumps, including CRI, Rotodel, Leakproof, Navaka PC and Vithram pumps.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://navakapumps.com" # the base hostname & protocol for your site
enforce_ssl: navakapumps.com   # force HTTPS
locale: en_IN
logo: /assets/img/navaka-logo.png

# SEO: `title` sets the browser/search title; `heading` (optional) overrides the visible page heading.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/navaka-social.png
  # Keep images and the old catalogue PDFs out of the sitemap.
  - scope:
      path: "assets"
    values:
      sitemap: false


# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing (internal notes and tooling should not be published).
exclude:
  - DESIGN.md
  - README.md
  - scripts/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  ignore:
    envs: [local]
  blanklines: false
  profile: false

incremental: false
cache: false
liquid:
  error_mode: strict
  strict_filters: true

# Force browser to reload assets
sass:
  style: expanded
  cache: false
