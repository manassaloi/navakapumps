<section class="featured-products" data-product-carousel aria-roledescription="carousel" aria-label="Product categories">
  <h2 class="section-title">Featured Products</h2>
  <p class="section-subtitle">Discover our range of high-quality industrial pumps and equipment</p>
  <div class="featured-products-grid" id="product-carousel-track">
    {% for product in site.data.featured_products %}
      <a class="product-card" href="{% if product.url %}{{ product.url | relative_url }}{% else %}{{ site.baseurl }}/products/#{{ product.name | slugify }}{% endif %}" aria-labelledby="featured-{{ forloop.index }}">
        <div class="image-container">
          <div class="product-model" {% if product.model != nil %}data-product-model="{{ product.model }}" aria-hidden="true"{% endif %}>
          <picture>

            <img 
              loading="lazy" 
              src="{{ site.baseurl }}{{ product.image }}" 
              alt="{{ product.name }}"
              width="400"
              height="300"
              decoding="async">
          </picture>
          </div>
        </div>
        <div class="content">
          <h3 id="featured-{{ forloop.index }}">{{ product.name }}</h3>
          <p>{{ product.description }}</p>
          <span class="learn-more">Learn More</span>
        </div>
      </a>
    {% endfor %}
  </div>
  <div class="carousel-controls" hidden>
    <button type="button" data-carousel-prev aria-label="Previous products" aria-controls="product-carousel-track">←</button>
    <button type="button" data-carousel-next aria-label="Next products" aria-controls="product-carousel-track">→</button>
  </div>
</section>
