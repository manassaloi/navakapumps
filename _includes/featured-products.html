<section class="featured-products">
  <h2 class="section-title">Featured Products</h2>
  <p class="section-subtitle">Discover our range of high-quality industrial pumps and equipment</p>
  <div class="featured-products-grid">
    {% for product in site.data.featured_products %}
      <a class="product-card" href="{{ site.baseurl }}/products/#{{ product.name | slugify }}" aria-labelledby="featured-{{ forloop.index }}">
        <div class="image-container">
          <div class="product-model" data-product-model="{{ forloop.index0 }}" aria-hidden="true">
          <picture>
            <source 
              srcset="{{ site.baseurl }}{{ product.image | replace: '.jpg', '.webp' }}"
              type="image/webp">
            <img 
              loading="lazy" 
              src="{{ site.baseurl }}{{ product.image }}" 
              alt="{{ product.name }}"
              width="400"
              height="300"
              decoding="async">
          </picture>
          </div>
        </div>
        <div class="content">
          <h3 id="featured-{{ forloop.index }}">{{ product.name }}</h3>
          <p>{{ product.description }}</p>
          <span class="learn-more">Learn More</span>
        </div>
      </a>
    {% endfor %}
  </div>
</section>
