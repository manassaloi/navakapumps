<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if site.enforce_ssl %}
  <script type="text/javascript">
    var host = "{{ site.enforce_ssl }}";
    if ((host == window.location.host) && (window.location.protocol != "https:"))
      window.location.protocol = "https";
  </script>
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  {%- seo -%}
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/favicon.png">
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/assets/favicon.png">
  {%- feed_meta -%}
  <!-- Animation functionality for scroll-triggered animations -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Add js-enabled class to body
      document.body.classList.add('js-enabled');
      
      // Setup Intersection Observer for scroll animations
      const animationObserver = new IntersectionObserver(
        (entries, observer) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('animate');
              observer.unobserve(entry.target); // Only animate once
            }
          });
        },
        { threshold: 0.15, rootMargin: '0px 0px -50px 0px' }
      );
      
      // Observe all elements that should animate on scroll
      document.querySelectorAll('.feature-card, .product-card, .section-title, .section-subtitle').forEach(
        el => animationObserver.observe(el)
      );
    });
  </script>
</head>
