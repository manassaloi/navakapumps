<header class="site-header">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}" aria-label="Navaka Pumps home">
      <span class="site-branding">
        <img src="{{ '/assets/img/navakaheader.svg' | relative_url }}" alt="" class="site-logo">
        <span class="site-name">{{ site.title | escape }}</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <div class="trigger">
        {% for item in site.data.navigation %}
          <a class="page-link" href="{{ item.url | relative_url }}" {% if page.url contains item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </div>
    </nav>
  </div>
</header>
